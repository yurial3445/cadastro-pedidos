version: '3.8'
services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
      POSTGRES_DB: pedidos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  
  web:
    build: .
    ports:
      - "8501:8501"
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASS: senha123
      DB_NAME: pedidos_db
    depends_on:
      - db

volumes:
  pgdata:
